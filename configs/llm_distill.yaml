teacher:
  provider: openai-compatible
  model: Qwen/Qwen3-VL-32B-Instruct
  task: grounding
  temperature: 0.0
  max_tokens: 1024

distillation:
  token_loss_weight: 0.0
  image_loss_weight: 0.0
  grounding_loss_weight: 0.0
  grounding_confidence: 0.9
  visual_utility_threshold: 0.5
  grounding_temperature: 0.1
  grounding_size: 256
  grounding_background_ratio: 0.0
  grounding_detach_backbone: true
  grounding_fusion_init: 0.0
  grounding_fusion: false
  utility_gate: false
  utility_gate_init: 0.0
  utility_gate_warmup_epochs: 2
  routed_crf_loss_weight: 0.5
  consistency_kl_weight: 0.2
  consistency_temperature: 2.0
  grounding_class_balance: true
  max_seq_length: 64
  max_images: 4

research:
  hypothesis: "LLM 证据路由视图能够作为训练期特权信息，提升学生对多图噪声的鲁棒性"
  primary_metric: entity_f1
  secondary_metrics:
    - entity_precision
    - entity_recall
    - accepted_grounding_entities
