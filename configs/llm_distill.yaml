teacher:
  provider: openai-compatible
  model: qwen2.5-vl-7b-instruct
  task: grounding
  temperature: 0.0
  max_tokens: 1024

distillation:
  token_loss_weight: 0.0
  image_loss_weight: 0.0
  grounding_loss_weight: 0.1
  grounding_confidence: 0.7
  grounding_temperature: 0.1
  grounding_size: 256
  grounding_class_balance: true
  max_seq_length: 64
  max_images: 4

research:
  hypothesis: "LLM 的实体语义和跨图像证据判断能够改善长尾实体和弱视觉证据样本"
  primary_metric: entity_f1
  secondary_metrics:
    - entity_precision
    - entity_recall
    - accepted_grounding_entities
